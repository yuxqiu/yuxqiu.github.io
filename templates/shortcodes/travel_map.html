<figure class="travel-map" role="img" aria-label="World map with visited places highlighted">
  {% set visited = load_data(path="data/visited.toml", format="toml") %}
  <style>
    {% for c in visited.places %}#{{ c }}, #{{ c }} path{% if not loop.last %}, {% endif %}{% endfor %} { fill: var(--accent); }
  </style>
  {{ load_data(path="data/world-map.svg", format="plain") | safe }}
  <figcaption>Map by <a href="https://github.com/flekschas/simple-world-map" target="_blank" rel="noopener">flekschas</a> — CC BY-SA 3.0</figcaption>
</figure>
